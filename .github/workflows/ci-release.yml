name: Cocos Splines — validation (manual releases only)

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Validate runtime types
        run: npm run check:runtime
      - name: Generate editor extension files
        run: npm run build
      - name: Verify Cocos extension structure
        run: npm run verify
      - name: Run regression tests
        run: npm test

# Release publishing is intentionally disabled. No tag or GitHub Release may
# be created without the owner's explicit approval. CI only validates pushes.
