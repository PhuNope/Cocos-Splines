name: Cocos Splines — validation only (no release)

on:
  push:
    branches:
      - v2.0.0
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Typecheck legacy runtime baseline
        run: npm run check:runtime
      - name: Typecheck new v2 core
        run: npm run check:v2
      - name: Build editor extension baseline
        run: npm run build
      - name: Verify extension structure
        run: npm run verify
      - name: Run regression tests including v2 core
        run: npm test

# Deliberately NO release/tag/upload job. Release publication is a separate,
# explicit, owner-approved action. Do not add an automatic on:push release job.
