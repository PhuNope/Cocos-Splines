name: Cocos Splines — validation and opt-in test build (no release)

on:
  push:
    branches:
      - v2.0.0
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
      - name: Typecheck legacy runtime baseline
        run: npm run check:runtime
      - name: Typecheck new v2 core
        run: npm run check:v2
      - name: Typecheck Cocos v2 Editor bridge
        run: npm run check:v2-editor
      - name: Build editor extension baseline
        run: npm run build
      - name: Verify extension structure
        run: npm run verify
      - name: Run regression tests including v2 core
        run: npm test

  package-v2-test:
    # This is a downloadable GitHub Actions *test artifact*, NOT a GitHub Release.
    # Only a deliberately marked commit or manually dispatched workflow builds it.
    if: >-
      github.ref == 'refs/heads/v2.0.0' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-build]')))
    needs: validate
    name: Stage installable v2 ZIP artifact (no tag, no release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Editor scripts
        run: npm run build
      - name: Stage and verify installable extension
        run: npm run pack:v2-test
      - name: Upload test extension folder as a single downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cocos-splines-v2.0.0-test-${{ github.sha }}
          path: test-build/
          if-no-files-found: error
          retention-days: 30

# NO tags, GitHub Releases, npm publish, or release assets are created here.
# The test artifact is available only from its GitHub Actions run for 30 days.

